<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · sagex</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Montserrat:wght@400..800&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>(function(){try{var t=localStorage.getItem("sagex-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}})();</script>
</head>
<body>
  <!-- Served for any missing URL, at any depth, so every link here is root-relative. -->
  <div class="rails" aria-hidden="true"><span class="beam"></span><span class="beam right"></span></div>
  <main class="hero" style="min-height: 100vh; display: grid; place-items: center">
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="container hero-inner">
      <a class="brand" href="/" style="justify-content: center"><img src="/assets/img/logo.svg" alt="" width="28" height="28">sagex</a>
      <div class="term" style="max-width: 560px; margin: 40px auto 0">
        <div class="term-bar"><span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="term-title">sagex</span></div>
        <div class="term-body"><span class="l"><span class="t-cli">❯</span> sagex show page <span data-path>/missing</span></span><span class="l"><span class="t-err">✗</span> No page named that. Check the address, or start from the home page.</span></div>
      </div>
      <div class="hero-ctas">
        <a class="btn btn-primary" href="/">Go home</a>
        <a class="btn btn-ghost" href="/commands.html">Browse the commands</a>
      </div>
    </div>
  </main>
  <script>document.querySelector("[data-path]").textContent = location.pathname;</script>
</body>
</html>
