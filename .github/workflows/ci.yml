name: CI

# Only for changes to the CLI and how it's packaged; the website (web/) has its own
# workflow. README.md and LICENSE ship inside the package (twine check validates the README).
on:
  push:
    branches: [main]
    paths:
      - "sagex/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.py"
      - "requirements.txt"
      - ".env.example"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "sagex/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.py"
      - "requirements.txt"
      - ".env.example"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Tests don't depend on the real values — the template's placeholders will do.
      - name: Create .env
        run: cp .env.example .env

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create .env
        run: cp .env.example .env

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      # Install the built wheel (not the source tree) the way a user would.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/sagex --version
          /tmp/wheel-env/bin/sagex --help
